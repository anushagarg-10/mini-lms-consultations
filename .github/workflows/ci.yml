name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, database tests, build, typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholders so the build can compile; no real Supabase is contacted.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Runs the migrations and 35 security checks on PGlite (Postgres in
      # WebAssembly), so CI needs no Docker or Supabase instance.
      - name: Database security tests
        run: npm run test:db

      - name: Build
        run: npm run build

      # After the build, so Next.js has generated its route types.
      - name: Typecheck
        run: npm run typecheck
